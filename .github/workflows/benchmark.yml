name: Performance baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Record environment and benchmark
        run: |
          set -euo pipefail
          { git rev-parse HEAD; go version; uname -a; lscpu; go test -run='^$' -bench=. -benchmem -count=5 ./...; } | tee benchmark.txt
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: performance-baseline
          path: benchmark.txt
